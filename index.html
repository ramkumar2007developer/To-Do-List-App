<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo-list</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="date-picker-wrap">
      <label for="datePicker" class="date-label">Date:</label>
      <input type="date" id="datePicker" class="date-picker" />
    </div>
    <h1>To-Do List 📋</h1>
    <hr />
    <center>
      <input
        type="search"
        id="searchBox"
        placeholder="Search Task 🔍︎"
        class="search-box"
      />
    </center>

    <div class="container">
      <input
        type="text"
        id="taskInput"
        placeholder="Enter Task..."
        class="enter-tsk"
      />
      <br />
      <button type="button" id="addButton" class="add-btn">Add</button>
    </div>

    <div class="filter">
      <button type="button" data-filter="all">All</button>
      <button type="button" data-filter="pending">Pending</button>
      <button type="button" data-filter="completed">Completed</button>
    </div>

    <table border="1">
      <thead>
        <tr>
          <th>S\NO</th>
          <th>CHECK</th>
          <th>TASK</th>
          <th>EDIT</th>
          <th>ACTION</th>
        </tr>
      </thead>

      <tbody id="task-table"></tbody>
    </table>

    <div id="emptyState" class="empty-state" hidden>No Task Is Found</div>

    <script src="script.js"></script>
  </body>
</html>
